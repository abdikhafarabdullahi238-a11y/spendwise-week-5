<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpendWise</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <h1>SpendWise Budget Tracker</h1>
  <input type="number" id="budget" placeholder="Monthly Budget (KSH)">
  <input type="text" id="expenseName" placeholder="Expense Name e.g Rent">
  <input type="number" id="expenseAmount" placeholder="Amount KSH">
  <button id="addBtn">Add Expense</button>
  <button id="calculateBtn">Calculate Budget</button>

  <h3>Expenses List</h3>
  <ul id="expenseList"></ul>
  <div id="result">
</div>
<script src="script.js"></script>
</body>
</html>
